{% extends "base.html" %}
{% block title %}Ingreso | GIA{% endblock %}
{% block body_class %}login-body{% endblock %}
{% block content %}
<section class="login-layout">
    <div class="login-card">
        <div class="login-brand">
            <img class="brand-logo brand-logo--login" src="{{ url_for('static', filename='img/logoSena.png') }}" alt="SENA">
            <div class="login-divider"></div>
            <strong>GIA</strong>
        </div>
        <h1>Inicia sesion</h1>
        <form method="post" class="login-form">
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contrasena" required>
            <div class="login-actions">
                <button type="submit" class="primary-btn">Ingresar</button>
                <a href="#" class="forgot-link">¿Haz olvidado tu contrasena?</a>
            </div>
        </form>
        <p class="login-footer-text">SENA | Complejo Tecnologico Minero Agroempresarial</p>
    </div>
</section>
{% endblock %}
