{% extends "base.html" %}
{% block title %}Ingresar - GIA{% endblock %}
{% block body_class %}login-body{% endblock %}
{% block content %}
<section class="login-layout">
  <div class="login-card">
    <div class="login-brand">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo-gia.svg') }}" alt="logo-gia">
    </div>

    <h1>Iniciar sesión</h1>

    <form method="post" class="login-form" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <input id="username" type="text" name="username" placeholder=" " required>
        <label for="username">Usuario</label>
      </div>

      <div class="form-group">
        <input id="password" type="password" name="password" placeholder=" " required>
        <label for="password">Contraseña</label>
      </div>

      <div class="login-actions">
        <button type="submit" class="login-btn">Acceder</button>
        <a href="#" class="forgot-link">¿Haz olvidado tu contraseña?</a>
      </div>
    </form>
    <p class="login-footer-text">
      <a href="https://ctmasena.blogspot.com/" target="_blank" rel="noopener noreferrer">Complejo Tecnológico Minero Agroempresarial</a>
    </p>
  </div>
</section>
{% endblock %}
